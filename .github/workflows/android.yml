name: Build Arya

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # attach build output to a GitHub Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # No Gradle wrapper is committed, so CI installs Gradle directly. Android Studio users: run
      # `gradle wrapper --gradle-version 8.14.3` once, or let Studio create the wrapper.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Lint (informational)
        run: gradle :app:lintDebug --no-daemon
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: Arya-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # ---- signed release build for Google Play (only when signing secrets exist) -----------------
      - name: Decode upload keystore
        id: keystore
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.ARYA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/arya-upload.jks"
          echo "path=$RUNNER_TEMP/arya-upload.jks" >> "$GITHUB_OUTPUT"

      - name: Release bundle (AAB) and APK
        if: ${{ steps.keystore.outputs.path != '' }}
        env:
          ARYA_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ARYA_KEYSTORE_PASSWORD: ${{ secrets.ARYA_KEYSTORE_PASSWORD }}
          ARYA_KEY_ALIAS: ${{ secrets.ARYA_KEY_ALIAS }}
          ARYA_KEY_PASSWORD: ${{ secrets.ARYA_KEY_PASSWORD }}
        run: gradle :app:bundleRelease :app:assembleRelease --no-daemon --stacktrace

      - name: Upload release artifacts
        if: ${{ steps.keystore.outputs.path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Arya-release
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk

      - name: Attach to GitHub Release (tags only)
        if: ${{ startsWith(github.ref, 'refs/tags/v') && steps.keystore.outputs.path != '' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
